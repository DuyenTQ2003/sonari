[project]
name = "sonari-speech"
version = "0.1.0"
description = "Sonari speech service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonari_speech"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
