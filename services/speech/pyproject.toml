[project]
name = "sonari-speech"
version = "0.1.0"
description = "Sonari speech service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "g2p-en>=2.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonari_speech"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint]
# IPA phoneme symbols are data here, not look-alike typos. The extend above is a plain
# key, so the shared quote entries are repeated.
allowed-confusables = ["’", "”", "ɪ", "ː", "ɑ", "ɡ", "ʔ", "ˈ", "ˌ"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["g2p_en.*", "nltk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
