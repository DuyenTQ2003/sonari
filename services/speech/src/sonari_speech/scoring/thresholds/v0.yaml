# GOP thresholds, version v0. UNCALIBRATED: no number here was fitted to any data.
#
# gop = mean over the phoneme's aligned frames of
#         log p(expected) - max over other phonemes q of log p(q)      (P02, spikes/gop/run_gop.py)
#
# gop_min: 0.0 is the boundary the definition itself gives: above it the model, on average over
# those frames, rates the expected phoneme above every rival; below it some other phoneme wins.
# It was fixed before the service ever ran and was not moved to fit the fixtures.
#
# What it has been checked against: the two G0 clips (one native speaker, LibriSpeech, int8
# model). Correct phonemes scored +1.5 to +6.3; "think" scored as "tink" gave /t/ -5.5 with θ
# heard. It has NOT been checked against hand-labelled Vietnamese speakers, and known false
# errors remain where one reference token stands for several realisations (weak-form vowels
# ə/æ, ɪ/ᵻ, the US flap; spikes/gop/phoneset/REPORT.md). Calibration is gate G1 (P24/P25): it
# replaces this file with v1, per phoneme if the data supports it.
version: v0-uncalibrated
gop_min: 0.0
