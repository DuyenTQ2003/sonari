[project]
name = "sonari-core"
version = "0.1.0"
description = "Sonari core service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "beanie>=1.27",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-pymongo>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt>=2.8",
    "pymongo>=4.9",
    "redis>=5.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "import-linter>=2.0",
    "jsonschema>=4.21",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonari_core"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]
# Deliberately import-broken packages that the import-boundary tests feed to lint-imports.
extend-exclude = ["tests/fixtures"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

# ADR-0001 rule 1: contexts never import each other. `make lint-core` runs these, and CI
# runs `make lint-core`, so a cross-context import fails the build. They read static
# imports only; see services/core/tests/test_import_boundaries.py for what that misses.
[tool.importlinter]
root_packages = ["sonari_core"]

[[tool.importlinter.contracts]]
name = "Bounded contexts never import each other (ADR-0001 rule 1)"
type = "independence"
modules = [
    "sonari_core.identity",
    "sonari_core.content",
    "sonari_core.learning",
    "sonari_core.gamification",
    "sonari_core.analytics",
]

[[tool.importlinter.contracts]]
name = "Layers: entry points, then contexts, then the shared kernel"
type = "layers"
layers = [
    "sonari_core.main",
    "sonari_core.app",
    "sonari_core.identity | sonari_core.content | sonari_core.learning | sonari_core.gamification | sonari_core.analytics",
    "sonari_core.shared",
]
