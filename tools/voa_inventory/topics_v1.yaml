# Keyword lists for the level 4 candidate topics of PLAN-v7 section 4.1.
#
# An item is tagged with a topic when its score reaches `min_score`. Each distinct keyword
# found in the title scores `title_weight`; each distinct keyword found in the first
# paragraph scores 1. A keyword ending in `*` matches any word starting with that stem;
# otherwise it must match a whole word or phrase. Matching ignores case.
#
# Keyword tagging over-counts (a "school" story is not always about studying), so a count
# from this file is an upper bound on topical fit. The final choice of passage for a unit
# is made in P50/P51 after reading it. The lists are English on purpose.
min_score: 2
title_weight: 2

topics:
  self_hometown:
    unit: 1
    label: Self and hometown
    keywords:
      - hometown*
      - home town
      - introduc*
      - yourself
      - about me
      - my name
      - where you are from
      - where you're from
      - where are you from
      - nationality
      - native country
