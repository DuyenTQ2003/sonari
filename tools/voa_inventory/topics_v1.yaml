    label: Health and the body
    keywords: [health*, doctor*, hospital*, medic*, sick*, disease*, diet*, nutrition*, vitamin*, dentist*, nurse*, pain*]
  weather_seasons:
    label: Weather and seasons
    keywords: [weather, rain*, snow*, storm*, summer, winter, spring, autumn, season*, temperature*, sunny, cloud*, climate*]
