# Topic definitions for the level 4 candidate topics of PLAN-v7 section 4.1, plus replacement
# candidates. One file drives two taggers, and both were fixed BEFORE the labelled sample
# was drawn (docs/voa-inventory.md, "How the tagger was chosen"):
#
#   phrase     topic-specific phrases (`phrases`) with negative patterns (`stop`, global and
#              per topic). Stop patterns are blanked out of the text before matching, so
#              "White House" cannot supply the word "house". A topic is tagged when its
#              score reaches `min_score`: each distinct phrase in the title scores
#              `title_weight`, each distinct phrase in the first paragraph scores 1.
#              A trailing `*` matches longer words; otherwise a whole word or phrase.
#   embedding  bge-m3 embedding of title + first paragraph against the `description` of every
#              topic and candidate and against the `other` descriptions (off-topic content).
#              The item gets the single nearest description if it is a topic or candidate,
#              not `other`, and its cosine similarity reaches `min_similarity`.
#
# The old bare-keyword lists are in topics_v1.yaml and are only used as a measured baseline.
min_score: 2
title_weight: 2

embedding:
  model: BAAI/bge-m3
  max_tokens: 256
  # Fixed before any label existed: a round value, not tuned on the labelled set.
  min_similarity: 0.40

stop:
  - white house
  - house of
  - house speaker
  - speaker of the house
  - house republicans
