exclude: ^\.claude/
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-vietnamese-in-python
        name: reject Vietnamese characters in .py files
        entry: python scripts/check_no_vietnamese.py
        language: python
        types: [python]
        exclude: (^|/)tests/fixtures/
      - id: strip-ai-trailers
        name: strip AI co-author trailers
        entry: sed -i -e '/^Co-[Aa]uthored-[Bb]y:.*[Cc]laude/d' -e '/Generated with \[Claude Code\]/d'
        language: system
        stages: [commit-msg]
