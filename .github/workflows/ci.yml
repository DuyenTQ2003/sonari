name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core, speech]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - run: uv sync --frozen --directory services/${{ matrix.service }}
      - run: make lint-${{ matrix.service }} typecheck-${{ matrix.service }} test-${{ matrix.service }}

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ""
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make lint-scripts test-scripts test-tools
      - run: uvx pre-commit run --all-files --show-diff-on-failure
